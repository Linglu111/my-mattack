# Configuration for ensemble_3models.py

defaults:
  - _self_

data:
  batch_size: 1   # 每批次处理一张图
  num_samples: 100  # 处理100张图
  output: "./LAT"  # 输出目录
  cle_data_path: "data/images/img2gps3k/"  # 干净图像目录
  tgt_data_path: "data/images/yfcc4k/"  # 目标图像目录

optim:
  alpha: 1.0  # 步长
  epsilon: 8  # 扰动上限（像素值）
  steps: 100  # 迭代步数

model:
  input_res: 640  # 输入图像分辨率
  use_source_crop: true
  use_target_crop: true
  crop_scale: [0.5, 0.9] 
  ensemble: true  # 是否使用模型集成
  device: "cuda:0"  # Using GPU 1
  backbone: ["B16", "B32", "Laion"]  # Use all models in ensemble

wandb:
  project: "local_adversarial_attack"
  entity: "104754251506@henu.edu.cn" # fill your wandb entity

attack: 'gsdm'  # （gsdm = FGSM + 地理显著性掩码约束）

gsdm:
  box_threshold: 0.25
  text_threshold: 0.20
  mask_fusion: "union"
  use_lpips: false
  lpips_weight: 0.2
  geo_label: null