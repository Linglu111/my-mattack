# Configuration for ensemble_3models.py

defaults:
  - _self_

data:
  batch_size: 1
  num_samples: 100
  output: "./LAT"
  cle_data_path: "myresources/images/img2gps3k/"

optim:
  alpha: 1.0  # 步长
  epsilon: 8  # 扰动上限（像素值）
  steps: 100  # 迭代步数

model:
  input_res: 640
  ensemble: true
  device: "cuda:0"
  backbone: ["B16", "B32", "Laion"]

wandb:
  project: "local_adversarial_attack"
  entity: "104754251506@henu.edu.cn" # fill your wandb entity

blackbox:
  model_name: "doubao"  # Can be gpt4o, claude, gemini, gpt_4v, doubao
  batch_size: 1
  timeout: 30

attack: 'dca'  # 攻击方法固定为 dca (Feature Dispersion 无向攻击)

# DCA配置（仅当attack='dca'时生效）
dca:
  use_gsdm: true
  gsdm:
    dinov2_model: "dinov2_vits14"
    use_sam_refine: true
  use_lpips: false
  lpips_weight: 0.2
  geo_label: null